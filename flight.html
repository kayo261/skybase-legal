<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A paragliding flight · Skybase</title>
<meta name="description" content="Watch this paragliding flight — animated GPS track and stats. Shared from Skybase." />
<!-- Link preview (Messages / WhatsApp / social) -->
<meta property="og:title" content="Watch my paragliding flight 🪂" />
<meta property="og:description" content="An animated GPS replay + stats, shared from Skybase." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://skybase.getlostadv.com/img/web-3d.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root{ --brand:#2e8b63; --bg:#12160f; --panel:#171d15; --line:#28331f; --ink:#eef3ea; --muted:#9db0a2; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #app{ display:flex; flex-direction:column; height:100%; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--line); }
  header .brand{ font-weight:800; letter-spacing:.2px; }
  header .brand span{ color:var(--brand); }
  .btn{ background:var(--brand); color:#fff; text-decoration:none; font-weight:700;
    padding:8px 14px; border-radius:10px; font-size:.9rem; white-space:nowrap; }
  #map{ flex:1 1 auto; min-height:0; background:#e6eae0; }
  .leaflet-container{ background:#e6eae0; }
  #controls{ display:flex; align-items:center; gap:12px; padding:10px 16px;
    border-top:1px solid var(--line); background:var(--panel); }
  #play{ appearance:none; border:none; background:var(--brand); color:#fff; font-weight:800;
    width:44px; height:44px; border-radius:50%; font-size:1.1rem; cursor:pointer; flex:none; }
  #scrub{ flex:1 1 auto; accent-color:var(--brand); }
  #clock{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:.85rem; min-width:74px; text-align:right; }
  #stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:2px 14px;
    padding:12px 16px; background:var(--panel); border-top:1px solid var(--line); }
  .stat .k{ font-size:.7rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  .stat .v{ font-size:1.05rem; font-weight:800; }
  #msg{ padding:40px 20px; text-align:center; color:var(--muted); }
  #msg h2{ color:var(--ink); }
  footer{ padding:14px 16px; text-align:center; font-size:.8rem; color:var(--muted); border-top:1px solid var(--line); }
  footer a{ color:var(--brand); }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Sky<span>base</span></div>
    <a class="btn" href="https://skybase.getlostadv.com/#get">Get the app</a>
  </header>

  <div id="msg">Loading flight…</div>

  <div id="map" class="hidden"></div>
  <div id="controls" class="hidden">
    <button id="play" aria-label="Play">▶</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" />
    <div id="clock">0:00</div>
  </div>
  <div id="stats" class="hidden"></div>

  <footer>
    Shared from <a href="https://skybase.getlostadv.com/">Skybase</a> — the paragliding companion.
    Decision support, not a clearance.
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// ---- Supabase config (public values — the anon key is a publishable client key,
// safe to ship in a static page, same as it ships in the app bundle) ----
const SUPABASE_URL = 'https://arttcbzgkvlhxxypyxyw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_pmJioRmWB-b-7ARXJZ9SSQ_634r4IMr'; // set at go-live (see PLAY/APP notes)

const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const id = qs.get('id');

function fail(title, detail){
  $('msg').classList.remove('hidden');
  $('msg').innerHTML = '<h2>'+title+'</h2><p>'+(detail||'')+'</p>'+
    '<p><a class="btn" href="https://skybase.getlostadv.com/#get">Get Skybase</a></p>';
  $('map').classList.add('hidden'); $('controls').classList.add('hidden'); $('stats').classList.add('hidden');
}

function fmtDur(s){ s=Math.max(0,Math.round(s)); const h=(s/3600)|0, m=((s%3600)/60)|0, sec=s%60;
  return h? h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0') : m+':'+String(sec).padStart(2,'0'); }
function fmtClock(s){ s=Math.max(0,Math.round(s)); const m=(s/60)|0, sec=s%60; return m+':'+String(sec).padStart(2,'0'); }

async function load(){
  if(!id){ return fail('No flight', 'This link is missing its flight id.'); }
  if(SUPABASE_ANON_KEY.indexOf('__')===0){ return fail('Viewer not configured yet', 'The flight viewer key hasn’t been set. Check back soon.'); }
  let row;
  try{
    const res = await fetch(SUPABASE_URL+'/rest/v1/rpc/get_shared_flight', {
      method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ share_id: id }),
    });
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    const data = await res.json();
    row = Array.isArray(data) ? data[0] : data;
  }catch(e){ return fail('Couldn’t load this flight', 'Please check your connection and try again.'); }
  if(!row || !row.track || !row.track.length){ return fail('Flight not found', 'This link may have expired or been removed.'); }
  render(row);
}

function render(row){
  const track = row.track, stats = row.stats || {};
  $('msg').classList.add('hidden');
  $('map').classList.remove('hidden'); $('controls').classList.remove('hidden'); $('stats').classList.remove('hidden');

  // Stats block
  const cells = [];
  if(stats.date) cells.push(['Date', new Date(stats.date).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})]);
  if(stats.site) cells.push(['Site', stats.site]);
  if(stats.durationS) cells.push(['Airtime', fmtDur(stats.durationS)]);
  if(stats.maxAltM!=null) cells.push(['Max alt', Math.round(stats.maxAltM)+' m']);
  if(stats.maxClimbMs!=null) cells.push(['Max climb', (+stats.maxClimbMs).toFixed(1)+' m/s']);
  if(stats.trackKm!=null) cells.push(['Distance', (+stats.trackKm).toFixed(1)+' km']);
  if(stats.xcKm!=null && stats.xcKm>=1) cells.push(['XC', '~'+Math.round(stats.xcKm)+' km']);
  $('stats').innerHTML = cells.map(c=>'<div class="stat"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>').join('');

  // Map + track
  const latlngs = track.map(p=>[p.lat, p.lon]);
  const map = L.map('map', { zoomControl:true, attributionControl:true });
  // Reliable OSM base UNDER the terrain layer: OpenTopoMap is prettier but flaky/
  // rate-limited, so where a terrain tile is missing/slow the standard OSM tile
  // shows through instead of a blank gap. keepBuffer holds more off-screen tiles
  // so panning/zoom shows fewer holes.
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, keepBuffer:4, attribution:'© OpenStreetMap' }).addTo(map);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom:17, keepBuffer:4, attribution:'© OpenTopoMap (CC-BY-SA) · © OpenStreetMap' }).addTo(map);
  map.fitBounds(L.latLngBounds(latlngs).pad(0.15));
  L.polyline(latlngs, { color:'#2e8b63', weight:3, opacity:.55 }).addTo(map);      // full faint track
  const trail = L.polyline([], { color:'#5ad6a0', weight:4 }).addTo(map);           // drawn-so-far
  const glider = L.marker(latlngs[0], { title:'position' }).addTo(map);

  // Replay: t is seconds-since-launch. Animate ~30 s of flight per real second,
  // capped so short hops still take a moment; scrub jumps anywhere.
  const T = track[track.length-1].t || 1;
  let playing=false, headT=0, raf=null, lastTs=null;
  const SPEED = Math.max(20, T/60); // whole flight in ~1 min, min 20x

  function idxAtT(t){ let lo=0,hi=track.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(track[m].t<t) lo=m+1; else hi=m; } return lo; }
  function apply(t){
    headT=Math.max(0,Math.min(T,t));
    const i=idxAtT(headT);
    trail.setLatLngs(latlngs.slice(0,i+1));
    glider.setLatLng(latlngs[Math.min(i,latlngs.length-1)]);
    $('scrub').value = String(Math.round(headT/T*1000));
    $('clock').textContent = fmtClock(headT)+' / '+fmtClock(T);
  }
  function tick(ts){ if(!playing) return; if(lastTs==null) lastTs=ts; const dt=(ts-lastTs)/1000; lastTs=ts;
    let nt=headT+dt*SPEED; if(nt>=T){ nt=T; setPlaying(false); } apply(nt); if(playing) raf=requestAnimationFrame(tick); }
  function setPlaying(p){ playing=p; $('play').textContent=p?'❚❚':'▶'; lastTs=null;
    if(p){ if(headT>=T) apply(0); raf=requestAnimationFrame(tick); } else if(raf){ cancelAnimationFrame(raf); } }

  $('play').onclick = ()=> setPlaying(!playing);
  $('scrub').oninput = (e)=>{ setPlaying(false); apply(e.target.value/1000*T); };
  apply(0);
}
load();
</script>
</body>
</html>
